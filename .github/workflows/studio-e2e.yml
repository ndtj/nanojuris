name: Studio E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/nanojuris/web/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - ".github/workflows/studio-e2e.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and QA dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev,studio,qa]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Studio browser tests
        run: pytest -m e2e -q
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-artifacts
          path: test-results/
