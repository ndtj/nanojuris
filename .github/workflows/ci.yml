name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Lint
        run: python -m ruff check src tests examples tools

      - name: Format check
        run: python -m ruff format --check src tests examples tools

      - name: Type check
        run: python -m mypy src

      - name: Build
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Enforce package size budget
        run: python tools/check_package_size.py --distribution dist

  package-smoke:
    name: Optional extras and clean wheel install
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install all supported extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,studio]"

      - name: Run offline suite with extras
        run: python -m pytest -q

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Enforce package size budget
        run: python tools/check_package_size.py --distribution dist

      - name: Install wheel in a clean environment
        run: |
          python -m venv .smoke-venv
          . .smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          nanojuris --version
          nanojuris fontes --fonte bnp_pangea
          python -c "import nanojuris.mcp_server, nanojuris.web.server; print('optional imports ok')"

      - name: Smoke test MCP extra from wheel
        run: |
          python -m venv .smoke-mcp-venv
          . .smoke-mcp-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "dist/$(basename dist/*.whl)[mcp]"
          python -c "from nanojuris.mcp_server import create_server; create_server(); print('mcp extra ok')"

      - name: Smoke test Studio extra from wheel
        run: |
          python -m venv .smoke-studio-venv
          . .smoke-studio-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "dist/$(basename dist/*.whl)[studio]"
          python -c "from nanojuris.web.app import create_app; create_app(); print('studio extra ok')"

  frontend:
    name: Workbench frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Verify generated bundle is committed
        run: git diff --exit-code -- src/nanojuris/web/static
