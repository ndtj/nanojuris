name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate tag and project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$project_version"

      - name: Install release dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,studio]"

      - name: Run release tests
        run: python -m pytest -q

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Enforce nano distribution budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          # 0.6.0 must meet the nano core budget before publication.
          assert wheel.stat().st_size <= 600_000, wheel.stat().st_size
          assert sdist.stat().st_size <= 1_500_000, sdist.stat().st_size
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert not any(name.startswith(("tests/", "frontend/", "specs/")) for name in names)
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              assert not any("/tests/" in name or "/frontend/" in name or "/specs/" in name for name in names)
          PY

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
