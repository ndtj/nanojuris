[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanojuris"
version = "0.3.0"
description = "NanoJuris: toolkit Python para busca, normalizacao e auditoria de jurisprudencia publica brasileira."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.11",
  "pypdf>=5.0",
  "requests>=2.28",
  "typing_extensions>=4.9"
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Luciano Molero"}
]
keywords = [
  "jurisprudencia",
  "precedentes",
  "direito",
  "legaltech",
  "lawtech",
  "bnp",
  "pangea",
  "cnj",
  "tjsp",
  "esaj",
  "mcp"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.setuptools]
packages = {find = {where = ["src"], include = ["nanojuris*"]}}

[tool.setuptools.package-data]
nanojuris = [
  "py.typed",
  "data/*.json",
  "web/static/index.html",
  "web/static/assets/*"
]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "mypy>=1.10",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.0"
]
qa = [
  "playwright>=1.40"
]
performance = [
  "lxml>=5.0",
  "cssselect>=1.2"
]
mcp = [
  "mcp>=1.0,<3"
]
studio = [
  "fastapi>=0.111",
  "uvicorn>=0.30"
]

[project.urls]
Homepage = "https://github.com/ndtj/nanojuris"
Source = "https://github.com/ndtj/nanojuris"
Issues = "https://github.com/ndtj/nanojuris/issues"
Institution = "https://ndtj.com.br/"

[project.scripts]
nanojuris = "nanojuris.cli:main"
nanojuris-mcp = "nanojuris.mcp_server:main"
nanojuris-studio = "nanojuris.web.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: testes opcionais que consultam fontes externas reais",
  "e2e: testes de navegador locais com Playwright"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# These modules intentionally contain long generated Markdown, HTML fixtures
# and report tables. Keep E501 enforced elsewhere without weakening those
# literal-heavy artifacts.
[tool.ruff.lint.per-file-ignores]
"src/nanojuris/discovery/draft.py" = ["E501"]
"tests/test_parsing.py" = ["E501"]
"tests/test_provider_closure_ledger.py" = ["E501"]
"tests/test_provider_discovery.py" = ["E501"]
"tests/test_tcu_jurisprudencia.py" = ["E501"]
"tools/audit_unified_contract.py" = ["E501"]
"tools/build_provider_closure_ledger.py" = ["E501"]
"tools/discover_all_providers.py" = ["E501"]
"tools/provider_discovery.py" = ["E501"]

[tool.coverage.run]
branch = true
source = ["nanojuris"]
# Browser and Studio app modules are optional integration boundaries. Their
# runtime contracts are exercised by optional smoke/e2e jobs, while the
# deterministic unit-coverage gate applies to the library core.
omit = [
  "src/nanojuris/cli.py",
  "src/nanojuris/discovery/browser.py",
  "src/nanojuris/web/app.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
follow_imports = "skip"
ignore_missing_imports = true
